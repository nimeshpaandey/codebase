<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSentinel - Multi-Language AI Code Review Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --severity-critical: #f85149;
            --severity-high: #ff7b72;
            --severity-medium: #d29922;
            --severity-low: #3fb950;
            --severity-info: #58a6ff;
            --code-bg: #0b0e14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #1f6feb, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .lang-badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lang-pill {
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            background: #21262d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .badge-status {
            font-size: 0.8rem;
            background: #238636;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-status::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            display: inline-block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-lang {
            background: var(--code-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            outline: none;
        }

        .select-lang:focus {
            border-color: var(--accent);
        }

        .sample-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sm:hover {
            background: #484f58;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: var(--code-bg);
            color: #79c0ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .checks-grid {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn-primary {
            background-color: #238636;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-primary:disabled {
            background-color: #30363d;
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .stats-pills {
            display: flex;
            gap: 10px;
        }

        .stat-pill {
            background: var(--code-bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .stat-pill.danger { border-color: var(--severity-critical); color: var(--severity-critical); }
        .stat-pill.warning { border-color: var(--severity-medium); color: var(--severity-medium); }
        .stat-pill.success { border-color: var(--severity-low); color: var(--severity-low); }

        .finding-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--severity-medium);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
            transition: transform 0.15s;
        }

        .finding-card:hover {
            transform: translateY(-2px);
        }

        .finding-card.critical { border-left-color: var(--severity-critical); }
        .finding-card.high { border-left-color: var(--severity-high); }
        .finding-card.medium { border-left-color: var(--severity-medium); }
        .finding-card.low { border-left-color: var(--severity-low); }
        .finding-card.info { border-left-color: var(--severity-info); }

        .finding-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .finding-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #ffffff;
        }

        .tag-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag.critical { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.4); }
        .tag.high { background: rgba(255,123,114,0.15); color: #ff7b72; border: 1px solid rgba(255,123,114,0.4); }
        .tag.medium { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid rgba(210,153,34,0.4); }
        .tag.low { background: rgba(63,185,80,0.15); color: #3fb950; border: 1px solid rgba(63,185,80,0.4); }

        .finding-meta {
            font-size: 0.84rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .finding-meta span {
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
        }

        .detail-block {
            margin-bottom: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .detail-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .code-box {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #7ee787;
            overflow-x: auto;
            margin-top: 4px;
        }

        .autofix-box {
            background: rgba(35, 134, 54, 0.1);
            border: 1px dashed rgba(63, 185, 80, 0.5);
            padding: 10px 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #7ee787;
            margin-top: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border-left-color: white;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-group">
                <span class="logo-icon">🛡️</span>
                <div>
                    <h1>CodeSentinel</h1>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Multi-Language AI Code Review Agent</p>
                </div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="lang-badges">
                    <span class="lang-pill">C++</span>
                    <span class="lang-pill">Python</span>
                    <span class="lang-pill">Java</span>
                </div>
                <span class="badge-status">Engine Active</span>
            </div>
        </header>

        <div class="card">
            <div class="toolbar">
                <div class="toolbar-left">
                    <label for="langSelect" style="font-weight: 600; font-size: 0.95rem;">Language:</label>
                    <select id="langSelect" class="select-lang" onchange="onLanguageChange()">
                        <option value="cpp">C++ (GCC / Clang)</option>
                        <option value="python">Python (AST / Security)</option>
                        <option value="java">Java (Javac Lint / Semantic)</option>
                    </select>
                </div>
                <div class="sample-buttons" id="sampleBtns">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <textarea id="codeInput" spellcheck="false"></textarea>

            <div class="checks-grid">
                <label class="checkbox-label"><input type="checkbox" id="chk_memory" value="memory_safety" checked> Memory Safety</label>
                <label class="checkbox-label"><input type="checkbox" id="chk_correctness" value="correctness" checked> Correctness</label>
                <label class="checkbox-label"><input type="checkbox" id="chk_security" value="security" checked> Security</label>
                <label class="checkbox-label"><input type="checkbox" id="chk_reliability" value="reliability" checked> Reliability</label>
                <label class="checkbox-label"><input type="checkbox" id="chk_perf" value="performance" checked> Performance</label>
            </div>

            <div class="action-bar">
                <span id="fileLabel" style="font-size: 0.85rem; color: var(--text-muted);">File: <code>source.cpp</code></span>
                <button class="btn-primary" id="reviewBtn" onclick="submitReview()">
                    <span id="btnText">Analyze Code</span>
                </button>
            </div>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        const samples = {
            cpp: {
                filename: "source.cpp",
                items: {
                    bad: `#include <iostream>

int main() {
    int arr[5];
    // Known Bug 1: Out of bounds (Memory Safety)
    arr[10] = 50; 
    
    // Known Bug 2: Uninitialized variable (Correctness)
    int uninit_val;
    std::cout << uninit_val << std::endl;

    return 0;
}`,
                    security: `#include <cstdio>
#include <cstdlib>

void run_backup() {
    char buffer[64];
    // Insecure C call: gets()
    gets(buffer);

    // Command injection risk
    system("tar -cvf backup.tar /data");
}`,
                    clean: `#include <iostream>
#include <vector>

int main() {
    std::vector<int> numbers = {10, 20, 30};
    int total = 0;
    for (int n : numbers) {
        total += n;
    }
    std::cout << "Total: " << total << std::endl;
    return 0;
}`
                }
            },
            python: {
                filename: "main.py",
                items: {
                    bad: `import os

# Bug 1: Mutable default argument (Correctness)
def add_item(item, items=[]):
    items.append(item)
    return items

def run_command(cmd):
    try:
        # Bug 2: Dangerous eval() (Security)
        result = eval(cmd)
        val = 10 / 0
    # Bug 3: Bare except (Reliability)
    except:
        pass
    return None`,
                    security: `import os
import sqlite3

def login_user(username, password):
    conn = sqlite3.connect("users.db")
    cursor = conn.cursor()
    # SQL Injection via string formatting
    query = f"SELECT * FROM users WHERE user = '{username}' AND pass = '{password}'"
    cursor.execute(query)

    # Command injection
    os.system("echo User " + username + " logged in")`,
                    clean: `from typing import List, Optional

def append_to_list(item: str, target: Optional[List[str]] = None) -> List[str]:
    """Appends item to target list safely without shared state."""
    result = list(target) if target is not None else []
    result.append(item)
    return result`
                }
            },
            java: {
                filename: "Main.java",
                items: {
                    bad: `import java.io.IOException;

public class Main {
    public static void main(String[] args) {
        // Bug 1: Array out of bounds (Memory Safety)
        int[] buffer = new int[5];
        buffer[10] = 42;

        // Bug 2: String comparison with == (Correctness)
        String userRole = "guest";
        if (userRole == "admin") {
            System.out.println("Access granted");
        }

        // Bug 3: Insecure command execution (Security)
        try {
            Runtime.getRuntime().exec("ls -la");
        } catch (IOException e) {
            // Ignored
        }
    }
}`,
                    security: `import java.sql.*;

public class UserService {
    public void findUser(Connection conn, String inputId) throws SQLException {
        Statement stmt = conn.createStatement();
        // SQL Injection via query string concatenation
        String sql = "SELECT * FROM accounts WHERE id = '" + inputId + "'";
        ResultSet rs = stmt.executeQuery(sql);
    }
}`,
                    clean: `import java.util.Objects;

public class Main {
    public static void main(String[] args) {
        String role = "editor";
        if (Objects.equals(role, "admin")) {
            System.out.println("Admin access");
        } else {
            System.out.println("Standard access");
        }
    }
}`
                }
            }
        };

        function onLanguageChange() {
            const lang = document.getElementById('langSelect').value;
            const config = samples[lang];
            
            // Update filename label
            document.getElementById('fileLabel').innerHTML = `File: <code>${config.filename}</code>`;
            
            // Update sample buttons
            const btnContainer = document.getElementById('sampleBtns');
            btnContainer.innerHTML = `
                <button class="btn-sm" onclick="loadSample('bad')">Sample: Buggy Code</button>
                <button class="btn-sm" onclick="loadSample('security')">Sample: Security Issues</button>
                <button class="btn-sm" onclick="loadSample('clean')">Sample: Clean Code</button>
                <button class="btn-sm" onclick="clearCode()">Clear</button>
            `;

            // Load default bad sample for current language
            document.getElementById('codeInput').value = config.items.bad;
        }

        function loadSample(key) {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('codeInput').value = samples[lang].items[key] || '';
        }

        function clearCode() {
            document.getElementById('codeInput').value = '';
        }

        async function submitReview() {
            const lang = document.getElementById('langSelect').value;
            const code = document.getElementById('codeInput').value.trim();
            const resultsDiv = document.getElementById('resultsContainer');
            const reviewBtn = document.getElementById('reviewBtn');
            const btnText = document.getElementById('btnText');

            if (!code) {
                alert("Please paste source code to analyze.");
                return;
            }

            const checkBoxes = ['chk_memory', 'chk_correctness', 'chk_security', 'chk_reliability', 'chk_perf'];
            const checks = checkBoxes
                .map(id => document.getElementById(id))
                .filter(el => el && el.checked)
                .map(el => el.value);

            reviewBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Analyzing...';
            resultsDiv.innerHTML = `
                <div class="card empty-state">
                    <div class="spinner" style="width: 32px; height: 32px; margin-bottom: 12px;"></div>
                    <p>Executing ${lang.toUpperCase()} static analysis & AI evaluation...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: lang,
                        code: code,
                        filename: samples[lang].filename,
                        checks: checks.length > 0 ? checks : ["security", "correctness", "reliability"]
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Server error");
                }

                const data = await response.json();
                renderResults(data);
            } catch (err) {
                resultsDiv.innerHTML = `
                    <div class="card" style="border-color: var(--severity-critical); color: var(--severity-critical);">
                        <h3>Analysis Failed</h3>
                        <p style="margin-top: 8px;">${err.message}</p>
                    </div>
                `;
            } finally {
                reviewBtn.disabled = false;
                btnText.textContent = 'Analyze Code';
            }
        }

        function renderResults(data) {
            const resultsDiv = document.getElementById('resultsContainer');
            const findings = data.findings || [];

            if (findings.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="card empty-state">
                        <h2 style="color: #3fb950; margin-bottom: 8px;">✅ Clean Codebase</h2>
                        <p>No defects or vulnerabilities detected for the selected checks.</p>
                        <p style="margin-top: 8px; font-size: 0.8rem; color: var(--text-muted);">Review ID: ${data.review_id}</p>
                    </div>
                `;
                return;
            }

            const criticalCount = findings.filter(f => f.severity === 'critical' || f.severity === 'high').length;

            let html = `
                <div class="card">
                    <div class="results-header">
                        <div>
                            <h2>Review Findings (${findings.length})</h2>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Review ID: <code>${data.review_id}</code></span>
                        </div>
                        <div class="stats-pills">
                            <span class="stat-pill ${criticalCount > 0 ? 'danger' : 'success'}">${criticalCount} High/Critical</span>
                            <span class="stat-pill">${findings.length} Total</span>
                        </div>
                    </div>
            `;

            findings.forEach(f => {
                const lineInfo = f.start_line ? (f.end_line && f.end_line !== f.start_line ? `L${f.start_line}-L${f.end_line}` : `L${f.start_line}`) : 'File-wide';
                const confidencePct = Math.round(f.confidence * 100);

                html += `
                    <div class="finding-card ${f.severity}">
                        <div class="finding-title-row">
                            <span class="finding-title">${f.title}</span>
                            <div class="tag-group">
                                <span class="tag ${f.severity}">${f.severity}</span>
                            </div>
                        </div>

                        <div class="finding-meta">
                            <div>Category: <span>${f.category}</span></div>
                            <div>Location: <span>${lineInfo}</span></div>
                            <div>Confidence: <span>${confidencePct}%</span></div>
                            <div>Source: <span>${f.source}</span></div>
                        </div>

                        <div class="detail-block">
                            <div class="detail-label">Evidence</div>
                            <div class="code-box">${escapeHtml(f.evidence)}</div>
                        </div>

                        <div class="detail-block">
                            <div class="detail-label">Impact</div>
                            <div>${escapeHtml(f.explanation)}</div>
                        </div>

                        <div class="detail-block">
                            <div class="detail-label">Actionable Fix</div>
                            <div>${escapeHtml(f.suggestion)}</div>
                            ${f.autofix ? `<div class="autofix-box"><strong>Autofix:</strong> <code>${escapeHtml(f.autofix)}</code></div>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            resultsDiv.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Initialize default view
        onLanguageChange();
    </script>
</body>
</html>
